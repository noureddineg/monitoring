global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'noureddineelmarzouqy@gmail.com'
  smtp_auth_username: 'noureddineelmarzouqy@gmail.com'
  smtp_auth_password: '*****************'
  smtp_require_tls: true

route:
  receiver: default
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # 1) Anything critical goes to the on-call receiver, quickly and often
    - matchers:
        - severity="critical"
      receiver: oncall-critical
      group_wait: 10s
      repeat_interval: 1h

    # 2) Infrastructure warnings go to the infrastructure team
    - matchers:
        - team="infrastructure"
      receiver: infra-team
      mute_time_intervals: ['outside-business-hours']

receivers:
  - name: default
    webhook_configs:
      - url: http://localhost:5001/default
        send_resolved: true
  - name: oncall-critical
    email_configs:
      - to: 'noureddineelmarzouqy@gmail.com' 
        send_resolved: true
        headers:
          Subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
    webhook_configs:
      - url: http://localhost:5001/oncall-critical
  - name: infra-team
    email_configs:
      - to: 'noureddineelmarzouqy@gmail.com' # Mettez votre adresse Gmail pour tester
        send_resolved: true
        headers:
          Subject: '[{{ .Status | toUpper }}] INFRA - {{ .CommonLabels.alertname }}'
    webhook_configs:
      - url: http://localhost:5001/infra-team
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['instance']

time_intervals:
  - name: outside-business-hours
    time_intervals:
      - weekdays: ['monday:friday']
        times:
          - start_time: '18:00'
            end_time: '24:00'
          - start_time: '00:00'
            end_time: '08:00'
      - weekdays: ['saturday', 'sunday']